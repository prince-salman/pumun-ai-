[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api-guts/*"
  to = "https://api.gutsai.id/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
